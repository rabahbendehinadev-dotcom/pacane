  # PRODUCTION ORDERS
  /production:
    get:
      operationId: getProductionOrders
      tags: [production]
      summary: List production orders
      parameters:
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
