  /products/{id}/stock:
    get:
      operationId: getProductStock
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Get product stock by branch
      responses:
        "200":
          description: Stock by branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockLevel"

  # STOCK
  /stock:
    get:
      operationId: getStockLevels
      tags: [stock]
      summary: Get stock levels
      parameters:
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: alert
          in: query
          schema:
            type: ["string", "null"]
