  /production/planning:
    get:
      operationId: getProductionPlanning
      tags: [production]
      summary: Get production planning suggestions
      parameters:
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Planning suggestions
          content:
