components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, archived, invited]
        language:
          type: string
          enum: [fr, ar]
        roleId:
          type: ["integer", "null"]
        roleName:
          type: ["string", "null"]
        branchIds:
          type: array
          items:
            type: integer
        defaultBranchId:
          type: ["integer", "null"]
        posAccess:
          type: boolean
        adminAccess:
          type: boolean
        lastLogin:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - username
        - status
        - language
        - posAccess
        - adminAccess
        - branchIds
        - createdAt

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        username:
          type: string
        password:
          type: string
        phone:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, archived, invited]
        language:
          type: string
          enum: [fr, ar]
        roleId:
          type: ["integer", "null"]
        branchIds:
          type: array
          items:
            type: integer
        posAccess:
          type: boolean
        adminAccess:
          type: boolean
      required:
        - name
        - email
        - username
        - password
        - status
        - language
        - posAccess
        - adminAccess
        - branchIds

    UpdateUserBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        roleId:
          type: ["integer", "null"]
        branchIds:
          type: ["array", "null"]
          items:
            type: integer
        posAccess:
          type: ["boolean", "null"]
        adminAccess:
          type: ["boolean", "null"]

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - isSystem
        - permissions
        - createdAt

    CreateRoleBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            type: string
      required:
        - name
        - permissions

    UpdateRoleBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        permissions:
          type: ["array", "null"]
          items:
            type: string

    Branch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [shop, lab, warehouse, central]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        isMain:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - code
        - type
        - isActive
        - isMain
        - createdAt

    CreateBranchBody:
      type: object
      properties:
        name:
          type: string
