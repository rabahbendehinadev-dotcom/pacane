  /stock/movements:
    get:
      operationId: getStockMovements
      tags: [stock]
      summary: Get stock movements
      parameters:
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
        - name: productId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
  /stock/alerts:
    get:
      operationId: getStockAlerts
      tags: [stock]
      summary: Get stock alerts
      responses:
        "200":
          description: Stock alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAlert"

  # PURCHASES
  /purchases:
    get:
      operationId: getPurchases
      tags: [purchases]
      summary: List purchases
      parameters:
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
        - name: supplierId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: paymentStatus
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Purchases list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Create purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseBody"
      responses:
